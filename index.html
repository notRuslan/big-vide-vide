<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List — Vue 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @keyframes bgShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .todo-item-enter-active { animation: fadeInUp 0.3s ease forwards; }
        .todo-item { transition: all 0.3s ease; }
        .todo-item:hover { transform: translateY(-2px); }
        .slide-fade-enter-active { transition: all 0.3s ease-out; }
        .slide-fade-leave-active { transition: all 0.2s ease-in; }
        .slide-fade-enter-from { opacity: 0; transform: translateX(-10px); }
        .slide-fade-leave-to { opacity: 0; transform: translateX(10px); }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-300 via-purple-300 to-pink-200 dark:from-gray-900 dark:via-purple-900 dark:to-indigo-900 flex items-center justify-center p-4 transition-colors duration-500" style="background-size: 200% 200%; animation: bgShift 8s ease infinite;">
    <div id="app" class="w-full max-w-lg">
        <!-- Header -->
        <div class="text-center mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-5xl font-bold text-white mb-2 drop-shadow-lg">📝 Todo List</h1>
                <p class="text-white/80 text-lg">Организуй свой день</p>
            </div>
            <button 
                @click="toggleTheme" 
                class="p-3 rounded-full bg-white/20 hover:bg-white/30 transition-all transform hover:scale-110 backdrop-blur-sm"
                :title="isDark ? 'Светлая тема' : 'Тёмная тема'"
            >
                <span v-text="isDark ? '☀️' : '🌙'"></span>
            </button>
        </div>

        <!-- Card -->
        <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm rounded-2xl shadow-2xl p-6 transition-colors duration-500">
            <!-- Input -->
            <div class="flex gap-3 mb-6">
                <input 
                    type="text" 
                    v-model="inputText"
                    @keypress.enter="addTodo"
                    placeholder="Добавить задачу..." 
                    class="flex-1 px-4 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-600 focus:border-purple-500 focus:outline-none transition-colors text-gray-700 dark:text-gray-200 dark:bg-gray-700 placeholder-gray-400"
                >
                <button 
                    @click="addTodo"
                    class="px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-500 text-white rounded-xl font-semibold hover:from-purple-700 hover:to-pink-600 transition-all transform hover:scale-105 shadow-lg disabled:opacity-50 disabled:transform-none disabled:cursor-not-allowed"
                    :disabled="!inputText.trim()"
                >
                    Добавить
                </button>
            </div>

            <!-- Stats -->
            <div v-if="todos.length > 0" class="flex gap-4 mb-4 text-sm text-gray-600 dark:text-gray-300 transition-opacity">
                <span class="bg-blue-100 dark:bg-blue-900/50 px-3 py-1 rounded-full">📋 Всего: <strong>{{ todos.length }}</strong></span>
                <span class="bg-green-100 dark:bg-green-900/50 px-3 py-1 rounded-full">✅ Готово: <strong>{{ doneCount }}</strong></span>
                <span class="bg-yellow-100 dark:bg-yellow-900/50 px-3 py-1 rounded-full">⏳ Осталось: <strong>{{ pendingCount }}</strong></span>
            </div>

            <!-- Todo List -->
            <ul v-if="todos.length > 0" class="space-y-2 max-h-96 overflow-y-auto">
                <li 
                    v-for="todo in todos" 
                    :key="todo.id"
                    class="todo-item flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-700/50 hover:bg-gray-100 dark:hover:bg-gray-700 group transition-colors"
                    :class="{ 'todo-item-enter-active': todo._animate }"
                >
                    <input 
                        type="checkbox" 
                        :checked="todo.done"
                        @change="toggleTodo(todo)"
                        class="w-5 h-5 rounded border-2 border-gray-300 dark:border-gray-600 text-purple-600 focus:ring-purple-500 cursor-pointer"
                    >
                    <span class="flex-1 transition-all" :class="todo.done ? 'line-through text-gray-400' : 'text-gray-700 dark:text-gray-200'">
                        {{ todo.text }}
                    </span>
                    <button 
                        @click="deleteTodo(todo)"
                        class="opacity-0 group-hover:opacity-100 transition-opacity text-red-400 hover:text-red-600 px-2"
                        title="Удалить"
                    >✕</button>
                </li>
            </ul>

            <!-- Empty State -->
            <div v-if="todos.length === 0" class="text-center py-8 text-gray-400 dark:text-gray-500">
                <p class="text-4xl mb-2">🎯</p>
                <p class="text-lg">Нет задач</p>
                <p class="text-sm mt-1">Добавьте свою первую задачу!</p>
            </div>

            <!-- Footer Actions -->
            <div v-if="todos.length > 0" class="hidden mt-4 pt-4 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <button 
                    v-if="doneCount > 0"
                    @click="clearCompleted"
                    class="text-sm text-red-500 hover:text-red-700 transition-colors font-medium"
                >
                    🗑️ Удалить выполненные
                </button>
                <div class="flex gap-3">
                    <button 
                        v-if="doneCount > 0"
                        @click="clearCompleted"
                        class="text-sm text-red-500 hover:text-red-700 transition-colors font-medium"
                    >
                        🗑️ Удалить выполненные
                    </button>
                    <button 
                        @click="clearAll"
                        class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 transition-colors"
                    >
                        Очистить всё
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white/60 dark:text-gray-400 mt-6 text-sm transition-colors">
            ✨ Данные сохраняются в localStorage
        </p>
    </div>

    <script>
        const { createApp, ref, computed, watch, onMounted } = Vue;

        createApp({
            setup() {
                const inputText = ref('');
                const todos = ref([]);
                const isDark = ref(false);

                // Load saved data
                onMounted(() => {
                    const saved = localStorage.getItem('todos');
                    if (saved) {
                        todos.value = JSON.parse(saved);
                    }

                    const savedTheme = localStorage.getItem('theme');
                    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        isDark.value = true;
                        document.documentElement.classList.add('dark');
                    }
                });

                // Save on change
                watch(todos, (newTodos) => {
                    localStorage.setItem('todos', JSON.stringify(newTodos));
                }, { deep: true });

                // Stats
                const doneCount = computed(() => todos.value.filter(t => t.done).length);
                const pendingCount = computed(() => todos.value.length - doneCount.value);

                // Actions
                function addTodo() {
                    const text = inputText.value.trim();
                    if (!text) return;

                    todos.value.push({
                        id: Date.now(),
                        text,
                        done: false,
                        createdAt: new Date().toISOString(),
                        _animate: true
                    });

                    inputText.value = '';
                }

                function toggleTodo(todo) {
                    todo.done = !todo.done;
                }

                function deleteTodo(todo) {
                    const idx = todos.value.indexOf(todo);
                    if (idx !== -1) {
                        todos.value.splice(idx, 1);
                    }
                }

                function clearCompleted() {
                    todos.value = todos.value.filter(t => !t.done);
                }

                function clearAll() {
                    if (confirm('Удалить все задачи?')) {
                        todos.value = [];
                    }
                }

                function toggleTheme() {
                    isDark.value = !isDark.value;
                    if (isDark.value) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                    }
                }

                return {
                    inputText,
                    todos,
                    isDark,
                    doneCount,
                    pendingCount,
                    addTodo,
                    toggleTodo,
                    deleteTodo,
                    clearCompleted,
                    clearAll,
                    toggleTheme
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
